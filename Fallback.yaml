  - name: FALLBACK
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 60
    timeout: 5000
    use:
      - MAIN       # VLESS подтягиваются в самом конце
    proxies:
      # 1. Proton via WARP
      - "Proton-via-Default"
      - "Proton-via-IPv6"
      
      # 2. Clean Proton
      - "Proton AWG"
      - "Proton-WG-RU"
