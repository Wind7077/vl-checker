# --- Группы прокси ---
proxy-groups:
  # ГЛАВНАЯ ГРУППА: url-test с высоким tolerance для приоритета Proton
  - name: "Auto-Reconnect"
    type: url-test
    proxies:
      - "🇷🇴 Proton_RO"       # Первый в списке (приоритет)
      - "🇳🇱 WARP_NL"         # Второй
      - "🇷🇺 WARP_Moscow"     # Третий
    url: 'http://cp.cloudflare.com/generate_204'
    interval: 60
    tolerance: 1000 # МАГИЯ: Не переключится на WARP, если разница в пинге меньше 1000мс

  # Дополнительная группа для ручного выбора
  - name: "Ручной выбор"
    type: select
    proxies:
      - "🇷🇴 Proton_RO"
      - "🇳🇱 WARP_NL"
      - "🇷🇺 WARP_Moscow"

# --- Правила маршрутизации ---
rules:
  - MATCH,Auto-Reconnect

# --- Настройки TUN для Android ---
tun:
  enable: true
  stack: mixed
  mtu: 1500
  auto-route: true
  strict-route: false
  endpoint-independent-nat: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
