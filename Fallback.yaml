    server: 185.107.56.211
    port: 443
    ip: 172.16.0.2
    public-key: 1+Zfm0ZR01P0ZZi+dNC46mDJdiVOLoM+OQPGjL+Z7DE=
    allowed-ips: ['0.0.0.0/0']
    reserved: [219, 184, 163]
    udp: true
    mtu: 1280
    keepalive: 25
    remote-dns-resolve: true
    dns: [10.2.0.1]
    amnezia-wg-option:
      jc: 0
      jmin: 40
      jmax: 70
      s1: 0
      s2: 0
      h1: 1
      h2: 2
      h4: 3
      h3: 4
      i1: <b 0xcd00000001014e00002e508cd55d618a8c5d76970f8f6e187c8d4af8fa9dfa10bca4c9c76b65e3684dec16b036afe07b8aa5c62638074c9c>

  # 2. PROTON RO (Румынский)
  - name: "🇷🇴 Proton_RO"
    type: wireguard
    server: 195.242.214.210
    port: 443
    ip: 10.2.0.2
    private-key: AABXG2noEPBZxHy/VM6aWU8x4nFpoBeKeUxhsn31Dmo=
    public-key: iKGECV5NZgXQ8mDSvupfeStGXBHDiO8VOOLs5U7KpGc=
    allowed-ips:
      - 0.0.0.0/0
    udp: true
    mtu: 1280
    remote-dns-resolve: true
    dns:
      - 1.1.1.1
    keepalive: 25
    amnezia-wg-option:
      jc: 4
      jmin: 40
      jmax: 70
      s1: 0
      s2: 0
      h1: 1
      h2: 2
      h3: 3
      h4: 4
      i1: "<b 0xcd0000000101980000405284273edb4375d493b2f6003fa22fd37c7d6c0690c6afee96936a059efb11933be0890d83a5935c98540b5ff79bf603ca1ac38ad9f55b07f1d09cb16288aa1f16c5cedab3104b5ee9ebb91a14a9b407ca16c6>"

  # 3. WARP Moscow (Российский)
  - name: "🇷🇺 WARP_Moscow"
    type: wireguard
    private-key: +CH1Ws1FQZDJocIHN05/xmjNVYQqQ7J+18WyqzE4QU8=
    server: 162.159.195.1
