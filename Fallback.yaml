# ====================================================================
# СПИСОК ПРОКСЕЙ
# ====================================================================
proxies:
  # ========================================
  # 4 PROTON ЧЕРЕЗ WARP MASQUE (Разные SNI)
  # ========================================
  
  # 1. Proton через Masque Gosuslugi
  - name: "Proton-via-Masque-Gos"
    <<: *proton-working
    server: 195.242.214.194
    port: 51820
    dialer-proxy: "WARP-MASQUE-GOS"

  # 2. Proton через Masque Sberbank
  - name: "Proton-via-Masque-Sber"
    <<: *proton-working
    server: 195.242.214.194
    port: 51820
    dialer-proxy: "WARP-MASQUE-SBER"

  # 3. Proton через Masque 4pda
  - name: "Proton-via-Masque-4pda"
    <<: *proton-working
    server: 195.242.214.194
    port: 51820
    dialer-proxy: "WARP-MASQUE-4PDA"

  # 4. Proton через Masque Microsoft
  - name: "Proton-via-Masque-MS"
    <<: *proton-working
    server: 195.242.214.194
    port: 51820
    dialer-proxy: "WARP-MASQUE-MS"

  # ========================================
  # 4 PROTON ЧЕРЕЗ WARP AMNEZIA (Разные endpoints)
  # ========================================
  
  # 5. Proton через WARP AWG 1 (engage.cloudflareclient.com)
  - name: "Proton-via-AWG-1"
    <<: *proton-working
    server: 195.242.214.194
    port: 51820
    dialer-proxy: "WARP-AWG-1"

  # 6. Proton через WARP AWG 2 (mfi.tribukvy.ltd)
  - name: "Proton-via-AWG-2"
    <<: *proton-working
    server: 195.242.214.194
    port: 51820
    dialer-proxy: "WARP-AWG-2"

  # 7. Proton через WARP AWG 3 (138.199.50.144)
  - name: "Proton-via-AWG-3"
    <<: *proton-working
    server: 195.242.214.194
    port: 51820
    dialer-proxy: "WARP-AWG-3"

  # 8. Proton через WARP AWG 4 (162.159.195.1)
  - name: "Proton-via-AWG-4"
    <<: *proton-working
    server: 195.242.214.194
    port: 51820
    dialer-proxy: "WARP-AWG-4"

  # ========================================
  # WARP MASQUE NODES (Для диалеров)
  # ========================================
  - name: "WARP-MASQUE-GOS"
    <<: *warp-masque-gos
    server: 162.159.199.57
    port: 8443
    network: h2

  - name: "WARP-MASQUE-SBER"
    <<: *warp-masque-sber
    server: 162.159.199.57
    port: 8443
    network: h2

  - name: "WARP-MASQUE-4PDA"
    <<: *warp-masque-4pda
    server: 162.159.198.2
    port: 443
    network: h2

  - name: "WARP-MASQUE-MS"
    <<: *warp-masque-ms
    server: 162.159.198.2
    port: 443
    network: h2
    skip-cert-verify: true
    tls:
      fragment: {packets: "tlshello,1", interval: "5-15", length: "100-200"}
      padding: {enable: true, min: 50, max: 150}

  # ========================================
  # WARP AMNEZIA NODES (Для диалеров)
  # ========================================
  - name: "WARP-AWG-1"
    <<: *warp-awg-1
    server: engage.cloudflareclient.com
    port: 2408
    fake_packets: "10-20"
    fake_packets_size: "20-50"
    fake_packets_delay: "10-50"

  - name: "WARP-AWG-2"
    <<: *warp-awg-2
    server: mfi.tribukvy.ltd
    port: 4500

  - name: "WARP-AWG-3"
    <<: *warp-awg-3

  - name: "WARP-AWG-4"
    <<: *warp-awg-4
    server: 162.159.195.1
    port: 500

# =========================
# ПРОКСИ ГРУППЫ
# =========================
proxy-groups:
  - name: FALLBACK
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 60
    timeout: 5000
    use:
      - MAIN
    proxies:
      # 4 через Masque
      - "Proton-via-Masque-Gos"
      - "Proton-via-Masque-Sber"
      - "Proton-via-Masque-4pda"
      - "Proton-via-Masque-MS"
      # 4 через Amnezia
      - "Proton-via-AWG-1"
      - "Proton-via-AWG-2"
      - "Proton-via-AWG-3"
      - "Proton-via-AWG-4"

  - name: AUTO
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 60
    tolerance: 50
    use:
      - MAIN
    proxies:
      - "Proton-via-Masque-Gos"
      - "Proton-via-Masque-Sber"
      - "Proton-via-Masque-4pda"
      - "Proton-via-Masque-MS"
      - "Proton-via-AWG-1"
      - "Proton-via-AWG-2"
      - "Proton-via-AWG-3"
      - "Proton-via-AWG-4"

  - name: SELECT
    type: select
    use:
      - MAIN
    proxies:
      - FALLBACK
      - AUTO
      - DIRECT
      - "Proton-via-Masque-Gos"
      - "Proton-via-Masque-Sber"
      - "Proton-via-Masque-4pda"
      - "Proton-via-Masque-MS"
      - "Proton-via-AWG-1"
      - "Proton-via-AWG-2"
      - "Proton-via-AWG-3"
      - "Proton-via-AWG-4"

