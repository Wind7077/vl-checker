# ====================================================================
# БАЗОВЫЕ НАСТРОЙКИ (Оптимизировано для мобильных сетей и ПК)
# ====================================================================
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: gvisor
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  endpoint-independent-nat: true

sniffer:
  enable: true
  sniff:
    HTTP: { ports: [80, 8080-8880] }
    TLS: { ports: [443, 8443, 854, 1180] }
    QUIC: { ports: [443] }
  force-dns-mapping: true
  parse-pure-ip: true
  skip-domain:
    - 'Mijia Cloud'
    - '+.push.apple.com'
    - '+.apple.com'
    - '+.samsungcloud.com'

dns:
  enable: true
  ipv6: false
  prefer-h3: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'dns.msftncsi.com'
    - 'www.msftncsi.com'
    - 'www.msftconnecttest.com'
    - 'localhost.ptlogin2.qq.com'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'
  default-nameserver:
    - 77.88.8.8
    - 217.118.83.6
  nameserver:
    - https://common.dot.dns.yandex.net/dns-query
    - https://dns.mts.ru/dns-query
  fallback:
    - https://common.dot.dns.yandex.net/dns-query

# =========================
#  ПОДПИСКА VLESS (Абсолютный резерв)
# =========================
proxy-providers:
  MAIN:
    type: http
    url: "https://raw.githubusercontent.com/Wind7077/vl-checker/refs/heads/main/output/proxies.txt"
    interval: 3600
    path: ./providers/main.yaml
    health-check:
      enable: true
      url: http://detectportal.firefox.com/success.txt
      interval: 300

