# --- БАЗОВЫЕ НАСТРОЙКИ PROTON VPN (Умный UDP-шум) ---
proton-common: &proton-common
  type: wireguard
  ip: 10.2.0.2
  private-key: +M453tPjxh3nVQcdzmjgeGoGizQ7fzzWw3UVDGki5Eo=
  public-key: aQ8bxW84kPY54cmd75U9rIHzg/mlpV1mJluXdm/6hFI=
  allowed-ips: ['0.0.0.0/0', '::/0']
  udp: true
  mtu: 1280
  keepalive: 25
  remote-dns-resolve: true
  dns: [10.2.0.1]
  amnezia-wg-option:
    jc: 12       # Больше мусорных пакетов в рукопожатии
    jmin: 30     # Плотная отправка мусора
    jmax: 120    # Широкий разброс задержек, ломающий корреляцию DPI
    s1: 8        # Смещение начала пакета (меняет сигнатуру длины)
    s2: 4        # Смещение конца пакета (защита от анализа хвоста)
    h1: 1
    h2: 2
    h3: 3
    h4: 4

# --- СПИСОК ПРОКСЕЙ ---
proxies:
- name: "Default-WARP"
  <<: *warp-common
  server: engage.cloudflareclient.com
  port: 2408

- name: "QUIC"
  <<: *warp-masque
  server: 162.159.198.2
  port: 443
  quic-version: [1]

- name: "H2"
  <<: *warp-masque
  server: 162.159.198.2
  port: 443
  network: h2
  skip-cert-verify: true
  tls:
    fragment:
      packets: "tlshello,1"
      interval: "5-15"
      length: "100-200" 
    padding:
      enable: true
      min: 50
      max: 150
  fake_packets: "5-15"
  fake_packets_size: "40-100"
  fake_packets_delay: "10-50"

- name: "Proton-WG-RU"
  <<: *proton-common
  server: 185.107.56.130
  port: 443
  # Умный UDP-шум: нечетные размеры, асинхронные задержки
  fake_packets: "8-16"
  fake_packets_size: "33-97"
  fake_packets_delay: "5-80"

- name: "🇳🇱 Proton_NL"
  <<: *proton-common
  server: 185.107.56.211
  port: 443
  ip: 172.16.0.2 
  private-key: gCyrLJwHsZznMzdOkqhOrzoZqzbvlj+03uuACy1jBGU=
  public-key: 1+Zfm0ZR01P0ZZi+dNC46mDJdiVOLoM+OQPGjL+Z7DE=
  reserved: [219, 184, 163]
  amnezia-wg-option:
    jc: 12
    jmin: 30
    jmax: 120
    s1: 8
    s2: 4
    h1: 1
    h2: 2
    h3: 3
    h4: 4
  fake_packets: "8-16"
  fake_packets_size: "33-97"
  fake_packets_delay: "5-80"

# --- ГРУППЫ ПРОКСЕЙ (БЫСТРЫЙ FALLBACK И АВТОВЫБОР) ---
proxy-groups:
  - name: "Proton-Auto"
    type: url-test
    tolerance: 100 
    interval: 30    
    timeout: 2000   # Таймаут 2 сек: если нет ответа, сразу считаем мертвым
    proxies:
      - "Proton-WG-RU"
      - "🇳🇱 Proton_NL"
    url: 'http://www.gstatic.com/generate_204'

  - name: "WARP-Auto"
    type: url-test
    tolerance: 100
    interval: 30
    timeout: 2000
    proxies:
      - "H2"
      - "QUIC"
      - "Default-WARP"
    url: 'http://speed.cloudflare.com/cdn-cgi/trace'

  - name: "Main-Fallback"
    type: fallback
    interval: 30
    timeout: 2000   # Мгновенное переключение на WARP при падении Proton
    proxies:
      - "Proton-Auto"
      - "WARP-Auto"
    url: 'http://www.gstatic.com/generate_204'

# --- ПРАВИЛА МАРШРУТИЗАЦИИ (ЗАЩИТА ОТ ПЕТЕЛЬ И CGNAT) ---
rules:
  - GEOIP,private,DIRECT,no-resolve
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT # Серые IP МТС (CGNAT), идут мимо туннеля
  - IP-CIDR,224.0.0.0/4,DIRECT
  - IP-CIDR,fe80::/10,DIRECT
  - IP-CIDR,1.1.1.1/32,DIRECT
  - IP-CIDR,1.0.0.1/32,DIRECT
  - IP-CIDR,8.8.8.8/32,DIRECT
  - IP-CIDR,8.8.4.4/32,DIRECT
  - MATCH,Main-Fallback
