# =========================
#  ПРОКСИ ГРУППЫ (Приоритеты и FallBack)
# =========================
proxy-groups:
  # 1. AUTO: Строгий приоритет сверху вниз
  - name: AUTO
    type: url-test
    tolerance: 50
    url: http://speed.cloudflare.com/
    interval: 30
    lazy: true
    use:
      - MAIN       # VLESS подтягиваются автоматически в самом конце
    proxies:
      # 1-3. ProtonViaWarp / Proton H2 / Proton Quick
      - "Proton-via-Default"
      - "Proton-via-H2"
      - "Proton-via-QUIC"
      - "Proton-via-IPv6"
      
      # 4. Чистый протон
      - "Proton-WG-RU"
      - "🇳🇱 Proton_NL"
      - "Proton AWG"
      - "NL-FREE#149"
      - "US-FREE#2"
      - "US-FREE#66"
      - "US-FREE#96"
      - "CA-FREE#31"
      - "US-FREE#99"
      - "US-FREE#105"
      - "CH-FREE#10"

      # 5. WARP Masque H2 и Quick
      - "WARP-H2"
      - "WARP-QUIC"
      - "H2 Gosuslugi"
      - "H2 Sberbank"
      - "QUIC Gosuslugi 942"
      - "QUIC Sberbank"

      # 6. Чистый WARP
      - "WARP-Default"
      - "Default-WARP"
      - "WARP-Original"
      # VLESS тестируются последними (через use: MAIN)

  # 2. FALLBACK: Резерв при падении
  - name: FALLBACK
    type: fallback
    url: http://speed.cloudflare.com/
    interval: 30
    lazy: true
    use:
      - MAIN
    proxies:
      - "Proton-via-Default"
      - "Proton-via-H2"
      - "Proton-via-QUIC"
      - "Proton-via-IPv6"
      - "Proton-WG-RU"
      - "🇳🇱 Proton_NL"
      - "Proton AWG"
      - "NL-FREE#149"
      - "US-FREE#2"
      - "US-FREE#66"
      - "US-FREE#96"
      - "CA-FREE#31"
      - "US-FREE#99"
      - "US-FREE#105"
      - "CH-FREE#10"
      - "WARP-H2"
      - "WARP-QUIC"
      - "H2 Gosuslugi"
      - "H2 Sberbank"
      - "QUIC Gosuslugi 942"
      - "QUIC Sberbank"
      - "WARP-Default"
      - "Default-WARP"
      - "WARP-Original"

  # 3. SELECT: Ручной выбор
  - name: SELECT
    type: select
    use:
      - MAIN
    proxies:
      - AUTO
      - FALLBACK
      - DIRECT
      - "Proton-via-Default"
      - "Proton-via-H2"
      - "Proton-via-QUIC"
      - "Proton-via-IPv6"
      - "Proton-WG-RU"
      - "🇳🇱 Proton_NL"
      - "Proton AWG"
      - "NL-FREE#149"
      - "US-FREE#2"
      - "US-FREE#66"
      - "US-FREE#96"
      - "CA-FREE#31"
      - "US-FREE#99"
      - "US-FREE#105"
      - "CH-FREE#10"
      - "WARP-H2"
      - "WARP-QUIC"
      - "H2 Gosuslugi"
      - "H2 Sberbank"
      - "QUIC Gosuslugi 942"
      - "QUIC Sberbank"
      - "WARP-Default"
      - "Default-WARP"
      - "WARP-Original"

  # Глобальный выход
  - name: GLOBAL
    type: select
    proxies:
      - SELECT
      - AUTO
      - DIRECT

