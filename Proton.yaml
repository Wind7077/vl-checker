proxies:
  - name: "Proton-NL-FREE"
    type: wireguard
    server: 89.105.214.198
    port: 51820
    ip: 10.2.0.2
    private-key: CJAiFAeiEMYgcIY2M3dMqzAFUEwxvkk+/tf66jaTT1c=
    public-key: JeixK91RfHbu9oOfBtuJO5wdZkTHVVPHAedxyZp27jE=
    allowed-ips: ['0.0.0.0/0', '::/0']
    reserved: [0, 0, 0]
    udp: true
    mtu: 1280                 # Безопасный MTU, предотвращает фрагментацию на мобильных сетях
    keepalive: 25             # Пульс каждые 25 сек, чтобы оператор не рвал NAT
    remote-dns-resolve: true
    dns: [10.2.0.1]           # Внутренний DNS ProtonVPN из вашего конфига

proxy-groups:
  - name: "Proton-Stable"
    type: select
    icon: https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/ProtonVPN_logo.svg/512px-ProtonVPN_logo.svg.png
    proxies:
      - Proton-NL-FREE
    url: 'https://proton.me/'
    interval: 180             # Проверка каждые 3 минуты (оптимально, не нагружает туннель)
    tolerance: 50             # Если задержка выросла на 50мс, Clash поймет, что сеть "деградировала"

rules:
  - MATCH,Proton-Stable

# Блок TUN для создания виртуальной сетевой карты в Android
tun:
  enable: true
  stack: mixed                # Максимальная совместимость на Android
  mtu: 1500                   # Системный MTU оставляем стандартным
  auto-route: true
  auto-detect-interface: true
  strict-route: false         # Мягкая маршрутизация: предотвращает обрывы при смене Wi-Fi/LTE
  dns-hijack:
    - any:53
