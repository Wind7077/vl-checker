      s1: 0
      s2: 0
      h1: 1
      h2: 2
      h4: 3
      h3: 4
      i1: 0xc700000001019d00002ef267d2787f429311c79a84d12ecbf30d5770685e9f54582e587aec6485e350e57c72f668323d7f49597a1bc5e97b

proxy-groups:
  - name: "Proton-Stable"
    type: select
    icon: https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/ProtonVPN_logo.svg/512px-ProtonVPN_logo.svg.png
    proxies:
      - Proton-NL-FREE
    url: 'https://1.1.1.1/cdn-cgi/trace'
    interval: 180
    tolerance: 50

rules:
  - MATCH,Proton-Stable

tun:
  enable: true
  stack: mixed
  mtu: 1500
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - any:53
