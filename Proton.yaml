proxies:
  - name: "WARP"
    type: wireguard
    private-key: gCyrLJwHsZznMzdOkqhOrzoZqzbvlj+03uuACy1jBGU=
    server: 185.107.56.211
    port: 443
    ip: 172.16.0.2
    public-key: 1+Zfm0ZR01P0ZZi+dNC46mDJdiVOLoM+OQPGjL+Z7DE=
    allowed-ips: ['0.0.0.0/0']
    reserved: [219, 184, 163]
    udp: true
    mtu: 1380
    keepalive: 25 # Добавлено: отправляет пульс каждые 25 сек, чтобы оператор не рвал NAT
    remote-dns-resolve: true
    dns: [10.2.0.1]
    amnezia-wg-option:
      jc: 0
      jmin: 40
      jmax: 70
      s1: 0
      s2: 0
      h1: 1
      h2: 2
      h4: 3
      h3: 4
      i1: <b 0xcd00000001014e00002e508cd55d618a8c5d76970f8f6e187c8d4af8fa9dfa10bca4c9c76b65e3684dec16b036afe07b8aa5c62638074c9c>

proxy-groups:
  - name: Cloudflare
    type: select
    icon: https://www.vectorlogo.zone/logos/cloudflare/cloudflare-icon.svg
    proxies:
      - WARP
    url: 'http://speed.cloudflare.com/'
    interval: 60 # БЫЛО 300. Стало 60 (проверка каждую минуту)
    tolerance: 50 # Если задержка выросла на 50мс, Clash поймет, что сеть "деградировала"

rules:
  - MATCH,Cloudflare

# Блок TUN для создания виртуальной сетевой карты в Android
tun:
  enable: true
  stack: mixed
  mtu: 1500 # MTU для самой системы Android
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
