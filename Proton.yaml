   i1: <b 0xc700000001019d00002ef267d2787f429311c79a84d12ecbf30d5770685e9f54582e587aec6485e350e57c72f668323d7f49597a1bc5e97b>

proxy-groups:
  - name: "Proton-Stable"
    type: select
    icon: https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/ProtonVPN_logo.svg/512px-ProtonVPN_logo.svg.png
    proxies:
      - Proton-NL-FREE
    url: 'https://1.1.1.1/cdn-cgi/trace'
    interval: 180             # Проверка каждые 3 минуты (оптимально, не нагружает туннель)
    tolerance: 50             # Если задержка выросла на 50мс, Clash поймет, что сеть "деградировала"

rules:
  - MATCH,Proton-Stable

# Блок TUN для создания виртуальной сетевой карты в Android
tun:
  enable: true
  stack: mixed                # Максимальная совместимость на Android
  mtu: 1500                   # Системный MTU оставляем стандартным
  auto-route: true
  auto-detect-interface: true
  strict-route: false         # Мягкая маршрутизация: предотвращает обрывы при смене Wi-Fi/LTE
  dns-hijack:
    - any:53
