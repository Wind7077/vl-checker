rules:
  - MATCH,Cloudflare

# Блок TUN для создания виртуальной сетевой карты в Android
tun:
  enable: true
  stack: mixed
  mtu: 1500 # MTU для самой системы Android
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
