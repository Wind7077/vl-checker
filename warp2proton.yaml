warp-masque: &warp-masque
  type: masque
  sni: "gosuslugi.ru"
  alpn: [h3] # Явно указываем, что это HTTP/3
  client-fingerprint: "chrome" # Заставляет QUIC handshake выглядеть как настоящий браузер Chrome
  private-key: "MHcCAQEEIMJxkuVGiLRVSdlueYZ4pRAhi19a43JABdxHZIuBnSKtoAoGCCqGSM49AwEHoUQDQgAE/8w5CTzGndKX2yGU8t0M/4On8+P3vcd+mgRSwKCLlfXGd+u+LOrD69HLuDMFjnTY6yg3LK7Ig074mYGcdvcPaw=="
  public-key: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w=="
  ip: 172.16.0.2
  ipv6: 2606:4700:110:820f:25ec:7ccd:9ae:1618
  udp: true
  remote-dns-resolve: true
  dns: [1.1.1.1, 1.0.0.1, 2606:4700:4700::1111, 2606:4700:4700::1001]
  skip-cert-verify: true

proxies:
# 1. Ваш рабочий H2 (TCP) - основа стабильности
- name: "WARP H2 Main"
  <<: *warp-masque
  server: 162.159.199.57
  port: 8443
  network: h2

- name: "WARP H2 Alt"
  <<: *warp-masque
  server: 162.159.193.1
  port: 854
  network: h2

# --- НОВЫЕ ПОПЫТКИ ОЖИВИТЬ QUIC (UDP) ---

# 2. QUIC с отпечатком Chrome на стандартном HTTPS порту
- name: "WARP QUIC Chrome"
  <<: *warp-masque
  server: 162.159.192.128
  port: 443

# 3. QUIC по IPv6 (Провайдеры часто забывают заблокировать UDP на IPv6!)
- name: "WARP QUIC IPv6"
  <<: *warp-masque
  server: "2606:4700:d0::a29f:c001"
  port: 443

# 4. QUIC на порту 500 (Иногда провайдеры думают, что это IPSec и пропускают)
- name: "WARP QUIC Port 500"
  <<: *warp-masque
  server: 162.159.199.57
  port: 500

# --- РЕЗЕРВ ---
- name: "Proton WireGuard"
  type: wireguard
  server: 185.107.56.106
  port: 51820
  ip: 10.2.0.2
  private-key: "KNc52wBsl1OdEFFoGFYlW7hW9ZsfehPHoLp+lLg8y0M="
  public-key: "V0F3qTpofzp/VUXX8hhmBksXcKJV9hNMOe3D2i3A9lk="
  allowed-ips: ['0.0.0.0/0', '::/0']
  udp: true
  remote-dns-resolve: true
  dns: [10.2.0.1]

proxy-groups:
- name: "Proxy"
  type: select
  proxies:
    - Fallback
    - Auto
    - WARP H2 Main
    - WARP H2 Alt
    - WARP QUIC Chrome
    - WARP QUIC IPv6
    - WARP QUIC Port 500
    - Proton WireGuard

- name: "Auto"
  type: url-test
  # В Auto добавляем все, чтобы он сам нашел, если QUIC вдруг пробьется
  proxies:
    - WARP H2 Main
    - WARP H2 Alt
    - WARP QUIC Chrome
    - WARP QUIC IPv6
    - WARP QUIC Port 500
    - Proton WireGuard
  url: 'http://www.gstatic.com/generate_204'
  interval: 60
  tolerance: 50

- name: "Fallback"
  type: fallback
  # В Fallback QUIC ставим в конце. Если он мертв, клиент не будет тратить время
  # и сразу возьмет H2. Но если вышка сотовой связи внезапно пропустит IPv6 UDP, 
  # он сможет подхватить и его.
  proxies:
    - WARP H2 Main
    - WARP H2 Alt
    - WARP QUIC IPv6
    - WARP QUIC Chrome
    - WARP QUIC Port 500
    - Proton WireGuard
  url: 'http://www.gstatic.com/generate_204'
  interval: 60

rules:
- MATCH,Proxy
