mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

# 1. Подключаем подписку как провайдера
proxy-providers:
  vless-list:
    type: http
    url: "https://raw.githubusercontent.com/Wind7077/vl-checker/refs/heads/main/output/proxies_b64.txt"
    interval: 3600 
    path: ./proxy_providers/vless-b64.txt
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 60 
    # ПРИНУДИТЕЛЬНО включаем UDP для всех скачанных прокси (строго нужно для WARP)
    override:
      udp: true

# 2. Настраиваем группы
proxy-groups:
  # Группа fallback: всегда использует самый быстрый живой прокси
  - name: "Fastest-VLESS"
    type: fallback
    use:
      - vless-list
    url: http://cp.cloudflare.com/generate_204
    interval: 60
    proxies:
      - DIRECT # Запасной вариант, если все VLESS умрут

  # Группа для конечного использования
  - name: "Proxy"
    type: select
    proxies:
      - WARP-via-VLESS
      - DIRECT

# 3. Настраиваем WARP (WireGuard)
proxies:
  - name: "WARP-via-VLESS"
    type: wireguard
    server: 8.34.146.154 # Можно заменить на IP 162.159.192.1
    port: 1180
    ip: 172.16.0.2
    public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
    private-key: yKe9jypeGWBPjnNXdUB0MbDCWEybrnnITqUurx2oZ20=
    udp: true
    # Заставляем WARP подключаться через самый быстрый VLESS
    dialer-proxy: "Fastest-VLESS"

# 4. Правила маршрутизации
rules:
  # Разрешаем Clash скачивать подписки и проверять прокси напрямую
  - DOMAIN-SUFFIX,githubusercontent.com,DIRECT
  - DOMAIN-SUFFIX,github.com,DIRECT
  - DOMAIN-SUFFIX,cloudflare.com,DIRECT
  - DOMAIN-SUFFIX,generate_204,DIRECT
  
  # Весь остальной трафик идет через WARP
  - MATCH,Proxy
