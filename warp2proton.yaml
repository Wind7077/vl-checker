# --- Базовые настройки ядра (Mihomo) ---
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
tcp-concurrent: true

# --- Сниффер ---
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# --- Настройки DNS ---
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.telegram.org'
    - '*.t.me'
    - '*.whatsapp.com'
    - '*.whatsapp.net'
    - '*.wa.me'
    - '*.facebook.com'
    - '*.fbcdn.net'
    - 'localhost.ptlogin2.qq.com'
    - 'dns.msftncsi.com'
    - 'www.msftncsi.com'
    - 'www.msftconnecttest.com'
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

# --- Прокси-ноды ---
proxies:
  # 1. WARP (обфусцированный AmneziaWG, первый туннель)
  - name: "WARP"
    type: wireguard
    private-key: +CH1Ws1FQZDJocIHN05/xmjNVYQqQ7J+18WyqzE4QU8=
    server: 162.159.195.1
    port: 500
    ip: 172.16.0.2
    public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
    allowed-ips:
      - 0.0.0.0/0
    reserved: [153, 176, 129]
    udp: true
    mtu: 1280
    persistent-keepalive: 25   # ИСПРАВЛЕНО: было "keepalive"
    remote-dns-resolve: false
    amnezia-wg-option:
      jc: 2
      jmin: 40
      jmax: 70
      s1: 0
      s2: 0
      h1: 1
      h2: 2
      h4: 3
      h3: 4
      i1: "<b 0xc10000000101ec00002ed30c87a529ebb80adafffa8ea23dba93b7b43d42936e8490affd0529319f89a02a3ce2938129137278b1c263081b>"

  # 2. PROTON через WARP (цепочка WG-over-WG)
  # ВАЖНО: mihomo имеет баг с двумя одновременными WG туннелями.
  # dialer-proxy корректно работает когда WARP используется только как транспорт.
  - name: "Proton_via_WARP"
    type: wireguard
    server: 195.242.214.210
    port: 51820          # ИЗМЕНЕНО: используй стандартный порт WG для Proton
                         # Если у тебя именно 443 в Proton конфиге — верни 443
    ip: 10.2.0.2
    private-key: AABXG2noEPBZxHy/VM6aWU8x4nFpoBeKeUxhsn31Dmo=
    public-key: iKGECV5NZgXQ8mDSvupfeStGXBHDiO8VOOLs5U7KpGc=
    allowed-ips:
      - 0.0.0.0/0
    udp: true
    mtu: 1200            # ИСПРАВЛЕНО: было 1000. Правильно: 1280 - 60 (WG overhead) - 20 (запас) = 1200
    persistent-keepalive: 25   # ИСПРАВЛЕНО: было "keepalive"
    remote-dns-resolve: true
    dns:
      - 10.2.0.1
    dialer-proxy: "WARP"
    # AmneziaWG для Proton — только если Proton-сервер это поддерживает.
    # Стандартный Proton WireGuard НЕ использует AmneziaWG на серверной стороне.
    # Убери amnezia-wg-option для Proton если он у тебя штатный ProtonVPN WG.
    # amnezia-wg-option здесь бессмысленно и может мешать рукопожатию.

  # 3. PROTON напрямую (запасной, только если WARP не нужен)
  - name: "Proton_Direct"
    type: wireguard
    server: 195.242.214.210
    port: 51820
    ip: 10.2.0.2
    private-key: AABXG2noEPBZxHy/VM6aWU8x4nFpoBeKeUxhsn31Dmo=
    public-key: iKGECV5NZgXQ8mDSvupfeStGXBHDiO8VOOLs5U7KpGc=
    allowed-ips:
      - 0.0.0.0/0
    udp: true
    mtu: 1280
    persistent-keepalive: 25
    remote-dns-resolve: true
    dns:
      - 10.2.0.1

# --- Группы прокси ---
proxy-groups:
  # Ручной выбор без health-check polling (убрали url/interval из select)
  - name: "PROXY"
    type: select
    proxies:
      - "Proton_via_WARP"
      - "Proton_Direct"
      - "WARP"

# --- Правила маршрутизации ---
rules:
  - MATCH,PROXY
