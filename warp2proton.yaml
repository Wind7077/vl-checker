# --- Базовые настройки ядра (Mihomo) ---
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

# --- Сниффер ---
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# --- Настройки DNS ---
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.telegram.org'
    - '*.t.me'
    - '*.whatsapp.com'
    - '*.whatsapp.net'
    - '*.wa.me'
    - '*.facebook.com'
    - '*.fbcdn.net'
    - localhost.ptlogin2.qq.com
    - dns.msftncsi.com
    - www.msftncsi.com
    - www.msftconnecttest.com
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

# --- Прокси-ноды ---
proxies:
  # 1. WARP (ПЕРВАЯ СТУПЕНЬ - "Трамплин")
  - name: "WARP_Tunnel"
    type: wireguard
    server: 162.159.195.1
    port: 500
    ip: 172.16.0.2
    private-key: +CH1Ws1FQZDJocIHN05/xmjNVYQqQ7J+18WyqzE4QU8=
    public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
    allowed-ips: ['0.0.0.0/0']
    reserved: [153, 176, 129]
    udp: true
    mtu: 1280
    keepalive: 25
    remote-dns-resolve: false
    dns: [8.8.8.8, 1.1.1.1]

  # 2. PROTON (ВТОРАЯ СТУПЕНЬ - Идет ЧЕРЕЗ WARP)
  - name: "Proton_via_WARP"
    type: wireguard
    server: 195.242.214.210
    port: 443
    ip: 10.2.0.2
    private-key: AABXG2noEPBZxHy/VM6aWU8x4nFpoBeKeUxhsn31Dmo=
    public-key: iKGECV5NZgXQ8mDSvupfeStGXBHDiO8VOOLs5U7KpGc=
    allowed-ips: ['0.0.0.0/0']
    udp: true
    mtu: 1280
    keepalive: 25
    remote-dns-resolve: true # ВАЖНО: DNS резолвится на стороне Proton
    dns: [1.1.1.1]
    dialer-proxy: "WARP_Tunnel" # МАГИЯ: Этот Proton подключается ЧЕРЕЗ WARP_Tunnel
    amnezia-wg-option:
      jc: 4
      jmin: 40
      jmax: 70
      s1: 0
      s2: 0
      h1: 1
      h2: 2
      h3: 3
      h4: 4
      i1: "<b 0xcd0000000101980000405284273edb4375d493b2f6003fa22fd37c7d6c0690c6afee96936a059efb11933be0890d83a5935c98540b5ff79bf603ca1ac38ad9f55b07f1d09cb16288aa1f16c5cedab3104b5ee9ebb91a14a9b407ca16c6>"

  # 3. ОДИНОЧНЫЙ PROTON (Для сравнения / как запасной вариант)
  - name: "Proton_Direct"
    type: wireguard
    server: 195.242.214.210
    port: 443
    ip: 10.2.0.2
    private-key: AABXG2noEPBZxHy/VM6aWU8x4nFpoBeKeUxhsn31Dmo=
    public-key: iKGECV5NZgXQ8mDSvupfeStGXBHDiO8VOOLs5U7KpGc=
    allowed-ips: ['0.0.0.0/0']
    udp: true
    mtu: 1280
    keepalive: 25
    remote-dns-resolve: true
    dns: [1.1.1.1]
    amnezia-wg-option:
      jc: 4
      jmin: 40
      jmax: 70
      s1: 0
      s2: 0
      h1: 1
      h2: 2
      h3: 3
      h4: 4
      i1: "<b 0xcd0000000101980000405284273edb4375d493b2f6003fa22fd37c7d6c0690c6afee96936a059efb11933be0890d83a5935c98540b5ff79bf603ca1ac38ad9f55b07f1d09cb16288aa1f16c5cedab3104b5ee9ebb91a14a9b407ca16c6>"

# --- Группы прокси ---
proxy-groups:
  # ГЛАВНАЯ ГРУППА: Переключение между цепочкой и прямым подключением
  - name: "Auto-Reconnect"
    type: select
    proxies:
      - "Proton_via_WARP"  # Двойной туннель (WARP -> Proton)
      - "Proton_Direct"    # Одиночный Proton (прямое подключение)
      - "WARP_Tunnel"      # Просто WARP (если Proton лег)
    url: 'http://www.gstatic.com/generate_204'
    interval: 60
    tolerance: 100

  # Группа для ручного выбора
  - name: "Manual_Select"
    type: select
    proxies:
      - "Proton_via_WARP"
      - "Proton_Direct"
      - "WARP_Tunnel"

# --- Правила маршрутизации ---
rules:
  - MATCH,Auto-Reconnect

# --- Настройки TUN для Android ---
tun:
  enable: true
  stack: mixed
  mtu: 1500
  auto-route: true
  strict-route: false
  endpoint-independent-nat: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
