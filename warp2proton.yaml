mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true # Ускоряет установку новых соединений

# Сниффинг: помогает правильно рутировать трафик и рвать мертвые соединения при смене сети
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
  # Заставляем Telegram быстро переподключаться при смене Wi-Fi на мобильную сеть
  force-domain:
    - "+.telegram.org"
    - "+.t.me"
    - "+.telegram.me"

# 1. Подключаем подписку как провайдера
proxy-providers:
  vless-list:
    type: http
    url: "https://raw.githubusercontent.com/Wind7077/vl-checker/refs/heads/main/output/proxies_b64.txt"
    interval: 3600 
    path: ./proxy_providers/vless-b64.txt
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 60 
    override:
      udp: true

# 2. Настраиваем группы
proxy-groups:
  - name: "Fastest-VLESS"
    type: fallback
    use:
      - vless-list
    url: http://cp.cloudflare.com/generate_204
    interval: 60
    proxies:
      - DIRECT

  - name: "Proxy"
    type: select
    proxies:
      - WARP-via-VLESS
      - DIRECT

# 3. Настраиваем WARP (WireGuard)
proxies:
  - name: "WARP-via-VLESS"
    type: wireguard
    server: 8.34.146.154
    port: 1180
    ip: 172.16.0.2
    public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
    private-key: yKe9jypeGWBPjnNXdUB0MbDCWEybrnnITqUurx2oZ20=
    udp: true
    mtu: 1280 # Уменьшаем размер пакета, чтобы туннель внутри туннеля не рвался
    dialer-proxy: "Fastest-VLESS"

# 4. Правила маршрутизации
rules:
  - DOMAIN-SUFFIX,githubusercontent.com,DIRECT
  - DOMAIN-SUFFIX,github.com,DIRECT
  - DOMAIN-SUFFIX,cloudflare.com,DIRECT
  - DOMAIN-SUFFIX,generate_204,DIRECT
  
  - MATCH,Proxy
