# ====================================================================
# ГЛОБАЛЬНЫЕ НАСТРОЙКИ DNS (Критично для обхода блокировок DNS)
# ====================================================================
dns:
  enable: true
  ipv6: false # Отключаем IPv6 в DNS, чтобы избежать утечек и ошибок на мобильных сетях
  prefer-h3: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip # Подменяет IP до проверки правил, ускоряет работу
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - 'dns.msftncsi.com'
    - 'www.msftncsi.com'
    - 'www.msftconnecttest.com'
    - 'localhost.ptlogin2.qq.com'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'
  default-nameserver:
    - 77.88.8.8   # Яндекс DNS
    - 217.118.83.6 # МТС DNS
  nameserver:
    - https://common.dot.dns.yandex.net/dns-query
    - https://dns.mts.ru/dns-query
  fallback:
    - https://common.dot.dns.yandex.net/dns-query

