mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

# 1. Подключаем вашу подписку как провайдера
proxy-providers:
  vless-list:
    type: http
    url: "https://raw.githubusercontent.com/Wind7077/vl-checker/refs/heads/main/output/proxies.yaml"
    interval: 3600 # Обновляем список раз в час
    path: ./proxy_providers/vless-list.yaml
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 120 # Проверяем пинг каждые 2 минуты (т.к. они дохнут)

# 2. Настраиваем группы
proxy-groups:
  # Группа, которая автоматически выбирает самый быстрый VLESS
  - name: "Fastest-VLESS"
    type: url-test
    use:
      - vless-list
    url: http://cp.cloudflare.com/generate_204
    interval: 120
    tolerance: 50 # Не переключать, если разница в пинге меньше 50мс

  # Группа для конечного использования
  - name: "Proxy"
    type: select
    proxies:
      - WARP-via-VLESS
      - DIRECT

# 3. Настраиваем WARP (WireGuard)
proxies:
  - name: "WARP-via-VLESS"
    type: wireguard
    server: 8.34.146.154 # Можно заменить на IP 162.159.192.1
    port: 1180
    ip: 172.16.0.2 # Например: 172.16.0.2
    ipv6: "0" # Отключаем (или вписываем ваш IPv6 от WARP)
    public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo= # Публичный ключ CF
    private-key: yKe9jypeGWBPjnNXdUB0MbDCWEybrnnITqUurx2oZ20=
    udp: true
    # МАГИЯ ЗДЕСЬ: Заставляем WARP подключаться через самый быстрый VLESS
    dialer-proxy: "Fastest-VLESS"

# 4. Правила маршрутизации
rules:
  # Чтобы VLESS могли проходить проверку (health-check), они должны ходить в нет напрямую
  - DOMAIN-SUFFIX,generate_204,DIRECT
  - DOMAIN-SUFFIX,cloudflare.com,DIRECT
  
  # Весь остальной трафик идет через WARP
  - MATCH,Proxy
