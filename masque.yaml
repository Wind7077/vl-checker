proton-new: &proton-new
  type: wireguard
  ip: 10.2.0.2
  ipv6: 2a07:b944::2:2
  private-key: sFAyGyyW7SB4vulxb85y1gzyiriJVUJprZY4/ywXcUE=
  public-key: JB84ctFi3l+gxJxr/kwYXlKwLcmqWxuuLBkpE1anmgo=
  allowed-ips: ['0.0.0.0/0', '::/0']
  udp: true
  mtu: 1150
  keepalive: 25
  remote-dns-resolve: true
  dns: [10.2.0.1, '2a07:b944::2:1']

proxies:
- name: "WARP-Default"
  <<: *warp-common
  server: engage.cloudflareclient.com
  port: 2408

- name: "WARP-QUIC"
  <<: *warp-masque
  server: 162.159.198.2
  port: 443
  quic-version: [1, 2]

- name: "WARP-H2"
  <<: *warp-masque
  server: 162.159.198.2
  port: 443
  network: h2
  skip-cert-verify: true
  # Fingerprint Firefox (не подозрительный для TSPU)
  client-fingerprint: firefox
  tls:
    fragment:
      packets: "tlshello,1"
      interval: "5-15"
      length: "100-200"
    padding:
      enable: true
      min: 50
      max: 150

- name: "Proton-via-H2"
  <<: *proton-new
  server: 195.242.214.194
  port: 51820
  dialer-proxy: "WARP-H2"

- name: "Proton-via-QUIC"
  <<: *proton-new
  server: 195.242.214.194
  port: 51820
  dialer-proxy: "WARP-QUIC"

- name: "Proton-via-Default"
  <<: *proton-new
  server: 195.242.214.194
  port: 51820
  dialer-proxy: "WARP-Default"

- name: "Proton-via-IPv6"
  <<: *proton-new
  server: 2a0d:5600:19:41::10
  port: 51820
  dialer-proxy: "WARP-Default"

proxy-groups:
# ВАЖНО: Только 2 узла в автотесте! Больше 3 параллельных = заморозка 120 сек
- name: "AUTO"
  type: url-test
  tolerance: 150
  interval: 300        # 5 минут между тестами (не забиваем канал)
  timeout: 15000       # 15 секунд на установку цепочки
  proxies:
    - "WARP-QUIC"      # Только QUIC (UDP, не создает параллельных TLS)
    - "WARP-Default"   # Только Default (UDP)
  url: 'http://www.gstatic.com/generate_204'

# FALLBACK: Сначала быстрые UDP, потом цепочки
- name: "FALLBACK"
  type: fallback
  interval: 300
  timeout: 15000
  proxies:
    - "WARP-QUIC"
    - "WARP-Default"
    - "Proton-via-QUIC"
    - "Proton-via-Default"
    - "WARP-H2"
    - "Proton-via-H2"
  url: 'http://www.gstatic.com/generate_204'

# SELECT: Все узлы для ручного выбора
- name: "SELECT"
  type: select
  proxies:
    - "AUTO"
    - "FALLBACK"
    - "Proton-via-H2"
    - "Proton-via-QUIC"
    - "Proton-via-Default"
    - "Proton-via-IPv6"
    - "WARP-H2"
    - "WARP-QUIC"
    - "WARP-Default"

rules:
  - GEOIP,private,DIRECT,no-resolve
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT
  - IP-CIDR,224.0.0.0/4,DIRECT
  - IP-CIDR,fe80::/10,DIRECT
  - IP-CIDR,1.1.1.1/32,DIRECT
  - IP-CIDR,1.0.0.1/32,DIRECT
  - IP-CIDR,8.8.8.8/32,DIRECT
  - IP-CIDR,8.8.4.4/32,DIRECT
  - MATCH,SELECT
