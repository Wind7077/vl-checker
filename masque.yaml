warp-common: &warp-common
  type: wireguard
  ip: 172.16.0.2
  ipv6: 2606:4700:110:882c:af48:5723:12f3:21ef
  private-key: CBbODE++ihCToj/ClkSktHNqpDiI6/x2SLBKvvetFXY=
  public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
  allowed-ips: ['0.0.0.0/0', '::/0']
  reserved: [185, 93, 172]
  udp: true
  mtu: 1280
  remote-dns-resolve: true
  dns: [1.1.1.1, 1.0.0.1]
  amnezia-wg-option:
   jc: 4
   jmin: 40
   jmax: 70
   s1: 0
   s2: 0
   h1: 1
   h2: 2
   h3: 3
   h4: 4

warp-masque: &warp-masque
  type: masque
  sni: max.ru
  private-key: MHcCAQEEIF0kkGh0QwcQbrKMG/7IOsERReGoXAhaeGLdwPoGBGUEoAoGCCqGSM49AwEHoUQDQgAEPm33c6cVhWVM/iV6kJPC4AtrgHhMEdeVcj0h7d6MmEQhRyRfbUzx86iR4fFKiZDPMfnaUGmKAjoP0VQcezwwlw==
  public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w==
  ip: 172.16.0.2
  ipv6: 2606:4700:110:846a:a144:fa58:8f97:d9de
  udp: true
  remote-dns-resolve: true
  dns: [1.1.1.1, 1.0.0.1]

proxies:
- name: "WARP-Default"
  <<: *warp-common
  server: engage.cloudflareclient.com
  port: 2408

- name: "WARP-QUIC"
  <<: *warp-masque
  server: 162.159.198.2
  port: 443
  quic-version: [1]

- name: "WARP-H2"
  <<: *warp-masque
  server: 162.159.198.2
  port: 443
  network: h2
  skip-cert-verify: true
  tls:
    fragment:
      packets: "tlshello,1"
      interval: "5-15"
      length: "100-200"
    padding:
      enable: true
      min: 50
      max: 150

proxy-groups:
- name: "SELECT"
  type: select
  proxies:
    - "WARP-QUIC"
    - "WARP-H2"
    - "WARP-Default"

rules:
  - MATCH,SELECT
