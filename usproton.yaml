# --- Группы прокси ---
proxy-groups:
  # ГЛАВНАЯ ГРУППА: url-test (Автоматически выбирает самую быструю ноду)
  - name: "Auto-Fastest"
    type: url-test
    proxies:
      - "NL-FREE#149"
      - "US-FREE#2"
      - "US-FREE#66"
      - "US-FREE#96"
      - "CA-FREE#31"
      - "US-FREE#99"
      - "US-FREE#105"
      - "CH-FREE#10"
    url: 'http://www.gstatic.com/generate_204'
    interval: 60
    tolerance: 50

  # Группа для ручного выбора
  - name: "Manual_Select"
    type: select
    proxies:
      - "NL-FREE#149"
      - "US-FREE#2"
      - "US-FREE#66"
      - "US-FREE#96"
      - "CA-FREE#31"
      - "US-FREE#99"
      - "US-FREE#105"
      - "CH-FREE#10"

# --- Правила маршрутизации ---
rules:
  - MATCH,Auto-Fastest

# --- Настройки TUN для Android ---
tun:
  enable: true
  stack: mixed
  mtu: 1500
  auto-route: true
  strict-route: false
  endpoint-independent-nat: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
