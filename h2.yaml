  <<: *warp-masque-mts
  server: 162.159.198.2
  port: 443

proxy-groups:
- name: Cloudflare
  type: url-test
  icon: https://www.vectorlogo.zone/logos/cloudflare/cloudflare-icon.svg
  proxies:
    - "MTS Shop (H2)"
  url: 'https://cp.cloudflare.com/generate_204'
  interval: 60
  timeout: 500
  lazy: false

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  nameserver:
    - 'https://1.1.1.1/dns-query'
    - 'https://8.8.8.8/dns-query'
  fallback:
    - 'tls://1.1.1.1'
    - 'tls://8.8.4.4'
  fake-ip-filter:
    - '*.lan'
    - '+.local'

tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - any:53
  mtu: 1280

rules:
- MATCH,Cloudflare
