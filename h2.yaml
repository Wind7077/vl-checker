keep-alive-idle: 10
keep-alive-interval: 5
disable-keep-alive: false
tcp-concurrent: true

proxies:
  - name: "MTS-H2"
    type: masque
    server: 162.159.198.2
    port: 443
    network: h2
    sni: shop.mts.ru
    private-key: MHcCAQEEIAxbO8TUXCmPXVXKFZ2l6Zx5gGTXhWEKDBAO73eFe8ZGoAoGCCqGSM49AwEHoUQDQgAEd9oGIwj/f8lx44YwcWL9FF7HxmoFhZCICJI6ODo2t2kzbtf1PdDv6BgFzhnWsl1J6lPucmeNbldHPCdUhJEugQ==
    public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w==
    ip: 172.16.0.2/32
    ipv6: 2606:4700:110:89bb:fa68:f3bf:636:815e/128
    mtu: 1280
    remote-dns-resolve: true
    skip-cert-verify: true
    client-fingerprint: curl
    udp: true

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "MTS-H2"

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '+.local'
    - 'localhost.ptlogin2.qq.com'
    - 'dns.msftncsi.com'
    - 'www.msftncsi.com'
    - 'www.msftconnecttest.com'
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - any:53
  mtu: 1280

rules:
  - MATCH,PROXY
