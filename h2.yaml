keep-alive-idle: 10
keep-alive-interval: 5
disable-keep-alive: false

warp-masque-mts: &warp-masque-mts
  type: masque
  sni: shop.mts.ru
  private-key: MHcCAQEEIAxbO8TUXCmPXVXKFZ2l6Zx5gGTXhWEKDBAO73eFe8ZGoAoGCCqGSM49AwEHoUQDQgAEd9oGIwj/f8lx44YwcWL9FF7HxmoFhZCICJI6ODo2t2kzbtf1PdDv6BgFzhnWsl1J6lPucmeNbldHPCdUhJEugQ==
  public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w==
  ip: 172.16.0.2/32
  ipv6: 2606:4700:110:89bb:fa68:f3bf:636:815e/128
  mtu: 1280
  remote-dns-resolve: true
  skip-cert-verify: true
  client-fingerprint: curl
  udp: true
  dns:
    - 'https://ac3755.dns.nextdns.io'
    - 8.8.8.8
    - 8.8.4.4

proxies:
  - name: "MTS Shop"
    <<: *warp-masque-mts
    server: 162.159.198.2
    port: 443

proxy-groups:
  - name: Cloudflare
    type: select
    proxies:
      - "MTS Shop"
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 120
    timeout: 2000
    lazy: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  nameserver:
    - 'https://1.1.1.1/dns-query'
    - 'https://8.8.8.8/dns-query'
  fallback:
    - 'tls://1.1.1.1'
    - 'tls://8.8.4.4'
  fake-ip-filter:
    - '*.lan'
    - '+.local'

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - 'any:53'
  mtu: 1280

rules:
  - MATCH,Cloudflare
