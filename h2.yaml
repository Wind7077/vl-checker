proxies:
- name: "[WARP-MASQUE] H2"
  <<: *warp-masque
  # Используем официальный домен вместо случайного IPv6
  server: engage.cloudflareclient.com
  port: 443
  network: h2
  # Этот параметр принудительно заставит Mihomo резолвить домен в IPv6 и подключаться по нему
  ip-version: ipv6-prefer

proxy-groups:
- name: Cloudflare
  type: select
  icon: https://www.vectorlogo.zone/logos/cloudflare/cloudflare-icon.svg
  proxies:
    - "[WARP-MASQUE] H2"

rules:
- DOMAIN-SUFFIX,t.me,Cloudflare
- DOMAIN-SUFFIX,telegram.org,Cloudflare
- MATCH,Cloudflare
