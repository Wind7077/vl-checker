mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
find-process-mode: off
global-client-fingerprint: chrome

keep-alive-idle: 30
keep-alive-interval: 15

# КРИТИЧЕСКИ ВАЖНО: Сохранение кэша между перезапусками и выходами из сна
profile:
  store-selected: true
  store-fake-ip: true

proxies:
- name: "MTS Shop (QUIC)"
  type: masque
  server: 162.159.198.2
  port: 443
  sni: shop.mts.ru
  private-key: MHcCAQEEIAxbO8TUXCmPXVXKFZ2l6Zx5gGTXhWEKDBAO73eFe8ZGoAoGCCqGSM49AwEHoUQDQgAEd9oGIwj/f8lx44YwcWL9FF7HxmoFhZCICJI6ODo2t2kzbtf1PdDv6BgFzhnWsl1J6lPucmeNbldHPCdUhJEugQ==
  public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w==
  ip: 172.16.0.2/32
  ipv6: 2606:4700:110:89bb:fa68:f3bf:636:815e/128
  udp: true
  mtu: 1280
  skip-cert-verify: true
  client-fingerprint: chrome
  dns:
    - 'quic://ac3755.dns.nextdns.io'
    - 'https://ac3755.dns.nextdns.io'

proxy-groups:
- name: MTS
  type: select
  proxies:
    - "MTS Shop (QUIC)"

# Настройка сниффера с исключением Telegram (убирает буферизацию MTProto)
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - '+.telegram.org'
    - '+.t.me'
    - '+.telegra.ph'
    - '+.telesco.pe'
    - '+.tg.dev'

dns:
  enable: true
  ipv6: true
  prefer-h3: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  nameserver:
    - 'https://1.1.1.1/dns-query'
  fake-ip-filter:
    - '*.lan'
    - '+.local'
    - '+.telegram.org'
    - '+.t.me'
    - '+.telegra.ph'
    - '+.telesco.pe'
    - '+.tg.dev'
    # Исключаем реальные IP-адреса дата-центров Telegram во избежание конфликтов сокетов
    - '149.154.160.0/20'
    - '91.108.4.0/22'
    - '91.108.8.0/22'
    - '91.108.12.0/22'
    - '91.108.16.0/22'
    - '91.108.56.0/22'
    - '91.108.20.0/22'
    - '91.108.24.0/22'
    - '95.161.64.0/20'

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - 'any:53'
  mtu: 1280
  # Позволяет ядру мгновенно отбрасывать мертвые UDP/QUIC сессии после сна
  endpoint-independent-nat: true

rules:
- MATCH,MTS
