# --- ГЛОБАЛЬНЫЕ НАСТРОЙКИ (Мгновенная реакция ядра) ---
unified-delay: false # Отключено: не тратит время на двойные замеры при wake-up
tcp-concurrent: true # Ускоряет установку TCP-соединений
find-process-mode: strict # Снижает нагрузку на CPU при пробуждении

# --- НАСТРОЙКИ DNS (Исключаем зависание системного DNS) ---
dns:
  enable: true
  ipv6: false # Отключение IPv6 ускоряет инициализацию стека после сна
  enhanced-mode: fake-ip # Fake-IP работает мгновенно
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - localhost.ptlogin2.qq.com
    - 'dns.msftncsi.com'
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
  proxy-server-nameserver:
    - 1.1.1.1 # Резолвит SNI, минуя медленный DNS мобильного оператора

# --- НАСТРОЙКИ TUN (Оптимизация для TCP) ---
tun:
  enable: true
  stack: system # Для чистого TCP стек system работает быстрее и стабильнее, чем gvisor/mixed
  dns-hijack:
    - any:53
  auto-route: true
  strict-route: true # Принудительно сбрасывает маршруты ОС, помогая быстрее перехватить трафик

# --- ПРОКСИ (Только H2 / TCP) ---
proxies:
  - name: "[WARP-MASQUE] H2"
    type: masque
    server: 162.159.198.2 # Захардкоженный IP, чтобы исключить DNS-резолв при старте
    port: 443
    sni: 4pda.to
    network: h2 # Принудительно используем HTTP/2 поверх TCP
    private-key: MHcCAQEEIGQZp7g74O7a9ScfenyGgXh2i6rXHyHtj2+9Xr6GGzOQoAoGCCqGSM49AwEHoUQDQgAEm9OJbQ7pEEphEOKTcaC7qgDuq4dHDVQaqxci5AywvQFft0HVSPFORK6+v4CbRjUbgQbwQuSDL1Qba2RCoN+AxQ==
    public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w==
    ip: 172.16.0.2
    udp: false # Критично: полностью отключаем UDP для этой ноды
    remote-dns-resolve: true
    dns: [1.1.1.1, 1.0.0.1]

# --- ГРУППЫ (Без URL-тестов) ---
proxy-groups:
  - name: Cloudflare
    type: select # Обычный селектор, никаких фоновых проверок (url/interval убраны)
    icon: https://www.vectorlogo.zone/logos/cloudflare/cloudflare-icon.svg
    proxies:
      - "[WARP-MASQUE] H2"

# --- ПРАВИЛА ---
rules:
  - MATCH,Cloudflare
