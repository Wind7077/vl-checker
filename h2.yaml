mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
find-process-mode: off
global-client-fingerprint: chrome

# Критически важные настройки для быстрого пробуждения Android
keep-alive-idle: 30
keep-alive-interval: 15

# Сохранение кэша между перезапусками и выходами из сна
profile:
  store-selected: true
  store-fake-ip: true

proxies:
- name: "MTS Shop (QUIC)"
  type: masque
  server: 162.159.198.2
  port: 443
  sni: shop.mts.ru
  private-key: MHcCAQEEIAxbO8TUXCmPXVXKFZ2l6Zx5gGTXhWEKDBAO73eFe8ZGoAoGCCqGSM49AwEHoUQDQgAEd9oGIwj/f8lx44YwcWL9FF7HxmoFhZCICJI6ODo2t2kzbtf1PdDv6BgFzhnWsl1J6lPucmeNbldHPCdUhJEugQ==
  public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w==
  ip: 172.16.0.2/32
  ipv6: 2606:4700:110:89bb:fa68:f3bf:636:815e/128
  udp: true
  mtu: 1280
  remote-dns-resolve: true
  skip-cert-verify: true
  client-fingerprint: chrome # Заменено с curl на chrome для Cloudflare Masque
  dns:
    - 'quic://ac3755.dns.nextdns.io'
    - 'https://ac3755.dns.nextdns.io'

proxy-groups:
- name: MTS
  type: select
  proxies:
    - "MTS Shop (QUIC)"

dns:
  enable: true
  ipv6: true
  prefer-h3: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  nameserver:
    - 'https://1.1.1.1/dns-query'
  fake-ip-filter:
    - '*.lan'
    - '+.local'
    # Домены Telegram добавлены в фильтр, чтобы избежать проблем с MTProto и Fake-IP
    - '+.telegram.org'
    - '+.t.me'
    - '+.telegra.ph'
    - '+.telesco.pe'
    - '+.tg.dev'

tun:
  enable: true
  stack: mixed # СТЕК ИЗМЕНЕН С gvisor НА mixed. Главное исправление для Android.
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53' # Добавлен перехват TCP DNS для предотвращения утечек при пробуждении
  mtu: 1280

rules:
- MATCH,MTS
