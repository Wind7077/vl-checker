mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  default-nameserver:
    - 8.8.8.8
    - 77.88.8.8          # Yandex DNS — резолвит NextDNS без похода через CF
  nameserver:
    - udp://45.90.28.0#ac3755   # основной — UDP NextDNS
  fallback:
    - https://dns.nextdns.io/ac3755   # запасной — тот же профиль, но DoH
    - udp://8.8.8.8
  fake-ip-filter:
    - "*.local"
    - "*.lan"
    - "ntp.*"
    - "time.*"

# =========================
# 🔥 ПОДПИСКИ (AUTO UPDATE)
# =========================
proxy-providers:
  MAIN:
    type: http
    url: "https://raw.githubusercontent.com/Wind7077/vl-checker/refs/heads/main/output/proxies_b64.txt"
    interval: 3600
    path: ./providers/main.yaml
    health-check:
      enable: true
      url: https://t.me
      interval: 300

  MOBILE_WL:
    type: http
    url: "https://raw.githack.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
    interval: 3600
    path: ./providers/mobile_wl.yaml
    health-check:
      enable: true
      url: https://t.me
      interval: 300

  VLESS_UNIVERSAL:
    type: http
    url: "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_universal.txt"
    interval: 3600
    path: ./providers/vless_universal.yaml
    health-check:
      enable: true
      url: https://t.me
      interval: 300

# =========================
# 🔀 ПРОКСИ ГРУППЫ
# =========================
proxy-groups:
  - name: AUTO
    type: url-test
    use:
      - MAIN
      - MOBILE_WL
      - VLESS_UNIVERSAL
    url: https://t.me
    interval: 300
    tolerance: 50

  - name: FALLBACK
    type: fallback
    use:
      - MAIN
      - MOBILE_WL
      - VLESS_UNIVERSAL
    url: https://t.me
    interval: 300

  - name: PROXY
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - DIRECT

  - name: GLOBAL
    type: select
    proxies:
      - PROXY
      - AUTO
      - DIRECT

# =========================
# 🌐 РУЛЫ (TRAFFIC ROUTING)
# =========================
rules:
  - DOMAIN-SUFFIX,google.com,PROXY
  - DOMAIN-SUFFIX,telegram.org,PROXY
  - DOMAIN-SUFFIX,youtube.com,PROXY
  - DOMAIN-SUFFIX,github.com,PROXY
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - MATCH,GLOBAL
