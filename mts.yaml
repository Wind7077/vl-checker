mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  default-nameserver:
    - 8.8.8.8
    - 77.88.8.8          # Yandex DNS — резолвит hostname NextDNS без похода через CF
  nameserver:
    - https://dns.nextdns.io/ac3755   # основной — DoH, обходит подмену DNS МТС
  fallback:
    - udp://8.8.8.8                   # запасной UDP DNS
    - https://dns.google/dns-query
  fake-ip-filter:
    - "*.local"
    - "*.lan"
    - "ntp.*"
    - "time.*"

# =========================
# 🔥 ПОДПИСКИ (AUTO UPDATE)
# =========================
proxy-providers:
  MAIN:
    type: http
    url: "https://raw.githubusercontent.com/Wind7077/vl-checker/refs/heads/main/output/proxies_b64.txt"
    interval: 3600
    path: ./providers/main.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

  MOBILE_WL:
    type: http
    url: "https://raw.githack.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
    interval: 3600
    path: ./providers/mobile_wl.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

  VLESS_UNIVERSAL:
    type: http
    url: "https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_universal.txt"
    interval: 3600
    path: ./providers/vless_universal.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

  FREE_HY2:
    type: http
    url: "https://raw.githubusercontent.com/wiki/gfpcom/free-proxy-list/lists/hy2.txt"
    interval: 21600
    path: ./providers/free_hy2.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600
      lazy: true

  FREE_ANYTLS:
    type: http
    url: "https://raw.githubusercontent.com/wiki/gfpcom/free-proxy-list/lists/anytls.txt"
    interval: 21600
    path: ./providers/free_anytls.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600
      lazy: true

# =========================
# 🔀 ПРОКСИ ГРУППЫ
# =========================
proxy-groups:
  - name: AUTO
    type: url-test
    use:
      - MAIN
      - MOBILE_WL
      - VLESS_UNIVERSAL
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: FALLBACK
    type: fallback
    use:
      - MAIN
      - MOBILE_WL
      - VLESS_UNIVERSAL
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: FREE
    type: url-test
    use:
      - FREE_HY2
      - FREE_ANYTLS
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100

  - name: PROXY
    type: select
    proxies:
      - AUTO
      - FALLBACK
      - FREE
      - DIRECT

  - name: GLOBAL
    type: select
    proxies:
      - PROXY
      - AUTO
      - DIRECT

# =========================
# 🌐 РУЛЫ (TRAFFIC ROUTING)
# =========================
rules:
  - DOMAIN-SUFFIX,google.com,PROXY
  - DOMAIN-SUFFIX,telegram.org,PROXY
  - DOMAIN-SUFFIX,youtube.com,PROXY
  - DOMAIN-SUFFIX,github.com,PROXY
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - MATCH,GLOBAL
