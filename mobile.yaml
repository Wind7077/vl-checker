warp-common: &warp-common
  type: wireguard
  ip: 172.16.0.2
  ipv6: 2606:4700:110:882c:af48:5723:12f3:21ef
  private-key: CBbODE++ihCToj/ClkSktHNqpDiI6/x2SLBKvvetFXY=
  public-key: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
  allowed-ips: ['0.0.0.0/0', '::/0']
  reserved: [185, 93, 172]
  udp: true
  mtu: 1280 # Безопасный MTU для мобильных сетей МТС (избегаем сетевой фрагментации)
  remote-dns-resolve: true
  # Используем DoT (TLS) для DNS, чтобы МТС не мог перехватить и подменить DNS-ответы
  dns: [tls://1.1.1.1, tls://1.0.0.1, '2606:4700:4700::1111', '2606:4700:4700::1001']
  amnezia-wg-option:
   # Максимальное зашумление handshake (аналог desync-fooling в Zapret)
   jc: 10      # Увеличено с 4 до 10 (больше мусорных пакетов при подключении)
   jmin: 50    # Увеличено с 40 до 50 (задержка между мусором)
   jmax: 100   # Увеличено с 70 до 100 (максимальный jitter для сбоя эвристики DPI)
   s1: 0       # Для МТС рекомендуется 0, чтобы не ломать прохождение через NAT [[18]]
   s2: 0       # Для МТС рекомендуется 0
   h1: 1       # Размеры мусорных заголовков Amnezia
   h2: 2
   h3: 3
   h4: 4
   i1: <b >

warp-masque: &warp-masque
  type: masque
  sni: 4pda.to
  private-key: MHcCAQEEIF0kkGh0QwcQbrKMG/7IOsERReGoXAhaeGLdwPoGBGUEoAoGCCqGSM49AwEHoUQDQgAEPm33c6cVhWVM/iV6kJPC4AtrgHhMEdeVcj0h7d6MmEQhRyRfbUzx86iR4fFKiZDPMfnaUGmKAjoP0VQcezwwlw==
  public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w==
  ip: 172.16.0.2
  ipv6: 2606:4700:110:846a:a144:fa58:8f97:d9de
  udp: true
  remote-dns-resolve: true
  dns: [tls://1.1.1.1, tls://1.0.0.1, '2606:4700:4700::1111', '2606:4700:4700::1001']
  packet-encoding: packetaddr # Стандартизирует пакеты, чтобы они выглядели как обычный трафик

proxies:
- name: "Default"
  <<: *warp-common
  server: engage.cloudflareclient.com
  port: 2408
  # Аналог стратегий ByeByeDPI (подмешивание мусорных пакетов перед соединением) [[99]]
  fake_packets: "10-20"
  fake_packets_size: "20-50"
  fake_packets_delay: "10-50"

- name: "QUIC"
  <<: *warp-masque
  server: 162.159.198.2
  port: 443 # Критично для МТС! Они не блокируют 443 UDP [[25]]
  quic-version: [1]

- name: "H2"
  <<: *warp-masque
  server: 162.159.198.2
  port: 443 # Критично для МТС!
  network: h2
  tls:
    # Стратегия Zapret: dpi-desync-split-pos (фрагментация TLS Hello) [[138]]
    fragment:
      packets: "tlshello"
      interval: "1-5"
      length: "10-30"
    # Стратегия Zapret: dpi-desync-fooling (добавление мусора в конец пакетов) [[53]]
    padding:
      enable: true
      min: 20
      max: 50

proxy-groups:
- name: Cloudflare
  type: select
  icon: https://www.vectorlogo.zone/logos/cloudflare/cloudflare-icon.svg
  proxies:
    - "QUIC"   # Приоритет 1: QUIC на 443 порту (самый устойчивый к блокировкам МТС)
    - "H2"     # Приоритет 2: HTTP/2 на 443 порту с фрагментацией TLS
    - "Default" # Приоритет 3: Классический WireGuard с fake_packets
  url: 'http://speed.cloudflare.com/'
  interval: 300

rules:
- MATCH,Cloudflare
