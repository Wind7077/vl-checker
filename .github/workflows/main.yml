name: Proxy Checker

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl unzip
          curl -L https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
          unzip -o xray.zip -d .
          chmod +x xray
          sudo mv xray /usr/local/bin/
          curl -L https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64 -o hysteria2
          chmod +x hysteria2
          sudo mv hysteria2 /usr/local/bin/

      - name: Download GeoIP databases (db-ip.com, no registration)
        run: |
          MONTH=$(date +%Y-%m)
          # Country база
          curl -L "https://download.db-ip.com/free/dbip-country-lite-${MONTH}.mmdb.gz" \
            -o dbip-country.mmdb.gz
          gunzip dbip-country.mmdb.gz
          mv dbip-country.mmdb GeoLite2-Country.mmdb
          # ASN база
          curl -L "https://download.db-ip.com/free/dbip-asn-lite-${MONTH}.mmdb.gz" \
            -o dbip-asn.mmdb.gz
          gunzip dbip-asn.mmdb.gz
          mv dbip-asn.mmdb GeoLite2-ASN.mmdb
          echo "Country DB: $(du -h GeoLite2-Country.mmdb | cut -f1)"
          echo "ASN DB:     $(du -h GeoLite2-ASN.mmdb | cut -f1)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install aiohttp geoip2

      - name: Run checker
        run: python scripts/check_proxies.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "update proxies $(date -u '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
