name: Proxy Checker

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90            # увеличен с 30 до 90 минут
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install aiohttp aiofiles

      - name: Run proxy checker
        env:
          ALLOWED_PROTOCOLS: "vless,hysteria2,trojan"
          REQUIRE_REALITY: "true"
          ALLOWED_COUNTRIES: "NL,DE,US"
          TOP_N: "250"
          STAGE2_CANDIDATES: "2500"
          MAX_CONCURRENT_TCP: "200"
          MAX_CONCURRENT_HTTP: "30"
          TIMEOUT_TCP: "1.5"
        run: python scripts/check_proxies.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ README.md
          git diff --cached --quiet || git commit -m "chore: update proxies $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
