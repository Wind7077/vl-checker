name: Proxy Checker

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl unzip

      - name: Install xray
        run: |
          curl -L https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
          unzip -o xray.zip -d .
          chmod +x xray
          sudo mv xray /usr/local/bin/

      - name: Install hysteria2
        run: |
          curl -L https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64 -o hysteria2
          chmod +x hysteria2
          sudo mv hysteria2 /usr/local/bin/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install aiohttp aiofiles

      - name: Run proxy checker
        env:
          STAGE2_CANDIDATES: 800
          MAX_CONCURRENT_HTTP: 15
          TIMEOUT_CURL: 7
          TIMEOUT_XRAY_START: 0.5
          TIMEOUT_HY2_START: 1.0
        run: python scripts/check_proxies.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ README.md
          git diff --cached --quiet || git commit -m "chore: update proxies $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
